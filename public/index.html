<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0b1a">
<title>가사 주크박스</title>
<style>
  :root {
    --bg:#0e0b1a; --bg2:#171230; --card:rgba(255,255,255,.06); --card-h:rgba(255,255,255,.1);
    --line:rgba(255,255,255,.12); --fg:#f4f1ff; --mut:#a49fc2;
    --a:#ff5fa2; --b:#7c5cff; --grad:linear-gradient(135deg,var(--a),var(--b));
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fbf9ff; --bg2:#efe9ff; --card:rgba(30,20,80,.05); --card-h:rgba(30,20,80,.09);
      --line:rgba(30,20,80,.14); --fg:#1d1640; --mut:#6c658f; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { color-scheme:dark light; }
  body {
    margin:0; min-height:100vh; color:var(--fg);
    font:16px/1.5 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, color-mix(in srgb,var(--b) 35%,transparent), transparent 60%),
      radial-gradient(700px 480px at -10% 10%, color-mix(in srgb,var(--a) 28%,transparent), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  main { max-width:760px; margin:0 auto; padding:20px 16px 220px; }
  .hide { display:none !important; }
  small, .mut { color:var(--mut); }

  /* 로고 */
  .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-.02em; }
  .logo i { width:30px; height:30px; border-radius:50%; background:
      radial-gradient(circle at center, var(--bg) 0 14%, transparent 15%),
      conic-gradient(from 0deg,#222,#444,#222,#555,#222); box-shadow:0 0 0 2px var(--line); position:relative; }
  .logo i::after { content:""; position:absolute; inset:10px; border-radius:50%; background:var(--grad); }

  /* 버튼/입력 */
  button { font:inherit; border:0; cursor:pointer; color:#fff; background:var(--grad); padding:11px 18px;
    border-radius:999px; font-weight:700; transition:transform .12s, filter .12s, background .12s; }
  button:hover { filter:brightness(1.08); } button:active { transform:scale(.96); }
  button.ghost { background:var(--card); color:var(--fg); border:1px solid var(--line); font-weight:600; }
  button.ghost:hover { background:var(--card-h); }
  input[type=text], input:not([type]) { width:100%; font:inherit; color:var(--fg); background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:13px 18px; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:not([type]):focus { border-color:var(--b); box-shadow:0 0 0 4px color-mix(in srgb,var(--b) 25%,transparent); }
  ::placeholder { color:var(--mut); }

  /* 입장 화면 */
  #join { min-height:82vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:18px; }
  #join h1 { font-size:clamp(34px,8vw,58px); line-height:1.1; margin:6px 0 0; letter-spacing:-.04em; font-weight:900; }
  #join h1 span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #join p { margin:0; max-width:420px; color:var(--mut); }
  .joinbox { display:flex; gap:8px; width:100%; max-width:420px; }
  .joinbox button { white-space:nowrap; }
  .record { width:150px; height:150px; border-radius:50%; margin-bottom:4px; position:relative;
    background:repeating-radial-gradient(circle at center,#15121f 0 2px,#201b30 2px 4px);
    box-shadow:0 20px 60px color-mix(in srgb,var(--b) 45%,transparent), 0 0 0 1px var(--line); animation:spin 6s linear infinite; }
  .record::after { content:""; position:absolute; inset:50px; border-radius:50%; background:var(--grad); box-shadow:0 0 0 6px #0003; }
  .record::before { content:""; position:absolute; inset:71px; border-radius:50%; background:var(--bg); z-index:1; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* 앱 상단 */
  .top { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .top .sp { flex:1; }
  .pill { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--mut); }
  .pill b { color:var(--fg); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3ddc97; margin-right:6px; box-shadow:0 0 8px #3ddc97; }

  /* 검색 */
  .hero { margin:6px 0 22px; }
  .hero h2 { font-size:clamp(22px,5vw,30px); letter-spacing:-.03em; margin:0 0 12px; font-weight:800; }
  .hero h2 span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #sf { display:flex; gap:8px; }
  #sf input { padding:15px 20px; font-size:17px; }

  /* 섹션 */
  h3 { display:flex; align-items:center; gap:8px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin:26px 4px 8px; font-weight:700; }
  h3 em { font-style:normal; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:0 8px; font-size:12px; }

  /* 곡 행 */
  .row { display:flex; gap:12px; align-items:center; padding:8px 10px; border-radius:16px; border:1px solid transparent;
    transition:background .15s, border-color .15s; animation:in .25s ease both; }
  .row:hover { background:var(--card); }
  .row img { width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--card); flex:none; box-shadow:0 4px 14px #0004; }
  .row .t { flex:1; min-width:0; }
  .row .t b, .row .t span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .t span { color:var(--mut); font-size:14px; }
  .row .n { width:22px; text-align:center; color:var(--mut); font-size:14px; flex:none; font-variant-numeric:tabular-nums; }
  #list .row { cursor:pointer; }
  #list .row.cur { background:linear-gradient(90deg,color-mix(in srgb,var(--a) 18%,transparent),color-mix(in srgb,var(--b) 18%,transparent)); border-color:var(--line); }
  #list .row.cur .n { color:var(--a); }
  .row button { padding:8px 14px; font-size:14px; }
  .row button.x { padding:6px 10px; background:transparent; border:0; color:var(--mut); font-size:16px; }
  .row button.x:hover { color:var(--a); background:var(--card); }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  .empty { text-align:center; padding:30px 10px; border:1px dashed var(--line); border-radius:18px; color:var(--mut); }

  /* 이퀄라이저 */
  .eq { display:inline-flex; gap:2px; align-items:flex-end; height:14px; margin-right:2px; }
  .eq i { width:3px; background:var(--a); border-radius:2px; animation:eq .9s ease-in-out infinite; height:100%; }
  .eq i:nth-child(2){ animation-delay:-.3s; background:var(--b);} .eq i:nth-child(3){ animation-delay:-.6s; }
  .paused .eq i { animation-play-state:paused; }
  @keyframes eq { 0%,100% { height:25%; } 50% { height:100%; } }

  /* 하단 플레이어 */
  .player { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg2) 82%,transparent); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--line); }
  .pin { max-width:760px; margin:0 auto; }
  #now { display:flex; gap:14px; align-items:center; padding:0; }
  .disc { width:64px; height:64px; border-radius:50%; flex:none; position:relative; background:#15121f center/cover;
    box-shadow:0 8px 24px #0006, 0 0 0 2px var(--line); animation:spin 7s linear infinite; animation-play-state:paused; }
  .playing .disc { animation-play-state:running; }
  .disc::after { content:""; position:absolute; inset:25px; border-radius:50%; background:var(--bg); box-shadow:0 0 0 3px #0005; }
  #now .t { flex:1; min-width:0; }
  #now .t b, #now .t span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #now .t b { font-size:17px; } #now .t span { color:var(--mut); font-size:14px; }
  .bar { display:flex; align-items:center; gap:10px; margin:10px 0 4px; font-size:12px; color:var(--mut); font-variant-numeric:tabular-nums; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:99px; outline:none; cursor:pointer;
    background:linear-gradient(90deg,var(--a) 0 var(--p,0%),var(--line) var(--p,0%) 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 0 0 3px var(--b); }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border:0; border-radius:50%; background:#fff; box-shadow:0 0 0 3px var(--b); }
  .ctl { display:flex; gap:10px; justify-content:center; align-items:center; }
  .ctl button { width:46px; height:46px; padding:0; font-size:18px; display:grid; place-items:center; }
  .ctl #pp { width:58px; height:58px; font-size:22px; box-shadow:0 8px 24px color-mix(in srgb,var(--a) 45%,transparent); }
  .note { text-align:center; font-size:12px; color:var(--mut); margin-top:6px; }

  @media (max-width:480px) { .joinbox { flex-direction:column; } #sf button { padding:11px 16px; } .disc { width:54px; height:54px; } .disc::after { inset:20px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; } }
</style>
</head>
<body>
<main>
  <div id="join">
    <div class="record"></div>
    <h1>가사 한 줄이면,<br><span>같이 듣는 플레이리스트</span></h1>
    <p>제목은 몰라도 괜찮아요. 기억나는 가사로 곡을 찾아 담고, 친구들과 같은 순간에 함께 들어요.</p>
    <div class="joinbox">
      <input id="room" placeholder="방 코드 입력" maxlength="32" autocomplete="off">
      <button id="enter">입장</button>
    </div>
    <button class="ghost" id="newRoom">🎲 새 방 만들기</button>
  </div>

  <div id="app" class="hide">
    <div class="top">
      <div class="logo"><i></i>주크박스</div>
      <div class="sp"></div>
      <span class="pill"><span class="dot"></span><b id="roomInfo"></b></span>
      <button class="ghost" id="copy">🔗 초대 링크</button>
    </div>

    <section class="hero">
      <h2>어떤 <span>가사</span>가 떠오르나요?</h2>
      <form id="sf">
        <input id="q" placeholder="가사, 곡 제목, 가수 — 예) 봄날, shape of you" autocomplete="off">
        <button>검색</button>
      </form>
    </section>
    <div id="results"></div>

    <h3>대기열 <em id="cnt">0</em></h3>
    <div id="list"></div>
  </div>
</main>

<div class="player hide" id="playerWrap">
  <div class="pin">
    <div id="now"></div>
    <div class="bar"><span id="tcur">0:00</span><input type="range" id="seek" min="0" max="30000" value="0"><span id="tdur">0:30</span></div>
    <div class="ctl">
      <button class="ghost" id="prev" aria-label="이전">⏮</button>
      <button id="pp" aria-label="재생/일시정지">▶</button>
      <button class="ghost" id="next" aria-label="다음">⏭</button>
    </div>
    <div class="note">30초 미리듣기로 재생돼요</div>
  </div>
</div>
<audio id="audio"></audio>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let room, state = null, offset = 0, seeking = false;
const audio = $('audio');

const roomFromUrl = new URLSearchParams(location.search).get('room');
if (roomFromUrl) $('room').value = roomFromUrl;

// 추측하기 어려운 랜덤 방 코드 (헷갈리는 문자 제외, 10자)
$('newRoom').onclick = () => {
  const cs = 'abcdefghjkmnpqrstuvwxyz23456789', b = crypto.getRandomValues(new Uint8Array(10));
  $('room').value = Array.from(b, x => cs[x % cs.length]).join('');
  $('enter').click();
};

$('enter').onclick = () => {
  room = $('room').value.trim().replace(/[^\w-]/g, '') || 'lobby';
  history.replaceState(null, '', '?room=' + room);
  $('join').classList.add('hide'); $('app').classList.remove('hide'); $('playerWrap').classList.remove('hide');
  // 클릭 이후이므로 브라우저 자동재생 제한 해제
  audio.play().catch(() => {});
  const es = new EventSource(`/api/room/${room}/events`);
  es.onmessage = e => apply(JSON.parse(e.data));
  // SSE가 프록시/터널에서 막혀도 동작하도록 2초마다 상태를 확인
  setInterval(() => fetch(`/api/room/${room}/state`).then(r => r.json()).then(apply).catch(() => {}), 2000);
};
function apply(s) { state = s; offset = s.serverNow - Date.now(); render(); }
$('room').addEventListener('keydown', e => e.key === 'Enter' && $('enter').click());

const send = a => fetch(`/api/room/${room}/act`, { method: 'POST', body: JSON.stringify(a) })
  .then(r => r.json()).then(apply).catch(() => {}); // 응답 상태를 바로 반영
$('copy').onclick = () => {
  navigator.clipboard.writeText(location.href).then(() => {
    $('copy').textContent = '✓ 복사됨'; setTimeout(() => $('copy').textContent = '🔗 초대 링크', 1600);
  }).catch(() => {});
};

$('sf').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('results').innerHTML = '<div class="empty">🔎 곡을 찾는 중...</div>';
  let list = [];
  try { list = await (await fetch('/api/search?q=' + encodeURIComponent(q))).json(); } catch {}
  $('results').innerHTML = list.length ? '<h3>검색 결과</h3>' : '<div class="empty">일치하는 곡을 찾지 못했어요.<br>곡 제목이나 가수 이름으로도 검색해 보세요.</div>';
  list.forEach(t => {
    const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = `<img src="${esc(t.cover)}" alt=""><div class="t"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><button>+ 담기</button>`;
    d.querySelector('button').onclick = () => { send({ type: 'add', track: t }); d.remove(); };
    $('results').appendChild(d);
  });
};

let loadedId = null;
function render() {
  const s = state, cur = s.playlist[s.index];
  $('roomInfo').textContent = `${room} · ${s.users}명`;
  $('cnt').textContent = s.playlist.length;
  document.body.classList.toggle('playing', !!(cur && s.playing));
  $('list').innerHTML = s.playlist.length ? '' : '<div class="empty">아직 비어 있어요.<br>위에서 가사를 검색해 첫 곡을 담아보세요 🎶</div>';
  s.playlist.forEach((t, i) => {
    const on = i === s.index;
    const d = document.createElement('div'); d.className = 'row' + (on ? ' cur' : '');
    const num = on ? `<span class="eq ${s.playing ? '' : 'paused'}"><i></i><i></i><i></i></span>` : (i + 1);
    d.innerHTML = `<div class="n">${num}</div><img src="${esc(t.cover)}" alt=""><div class="t"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><button class="x" aria-label="삭제">✕</button>`;
    d.onclick = () => send({ type: 'select', index: i });
    d.querySelector('button').onclick = e => { e.stopPropagation(); send({ type: 'remove', id: t.id }); };
    $('list').appendChild(d);
  });
  $('now').innerHTML = cur
    ? `<div class="disc" style="background-image:url('${esc(cur.cover)}')"></div><div class="t"><b>${esc(cur.title)}</b><span>${esc(cur.artist)}</span></div>`
    : `<div class="disc"></div><div class="t"><b>재생 중인 곡이 없어요</b><span>곡을 담으면 바로 시작돼요</span></div>`;
  $('pp').textContent = s.playing ? '⏸' : '▶';

  if (!cur) { audio.pause(); loadedId = null; return; }
  if (loadedId !== cur.id) { audio.src = cur.previewUrl; loadedId = cur.id; }
  const target = (s.pos) / 1000; // 서버가 serverNow 시점 기준으로 계산한 위치
  if (Math.abs(audio.currentTime - target) > 0.7) {
    try { audio.currentTime = target; } catch { audio.addEventListener('loadedmetadata', () => audio.currentTime = target, { once: true }); }
  }
  if (s.playing) audio.play().catch(() => {}); else audio.pause();
}

function paintSeek() { const v = +$('seek').value; $('seek').style.setProperty('--p', (v / 300) + '%'); $('tcur').textContent = fmt(v / 1000); }
audio.onended = () => { const c = state && state.playlist[state.index]; if (c) send({ type: 'ended', id: c.id }); };
audio.ontimeupdate = () => { if (!seeking) { $('seek').value = audio.currentTime * 1000; paintSeek(); } };
$('seek').oninput = () => { seeking = true; paintSeek(); };
$('seek').onchange = e => { seeking = false; send({ type: 'seek', pos: +e.target.value }); };
$('pp').onclick = () => send({ type: state.playing ? 'pause' : 'play' });
$('next').onclick = () => send({ type: 'next' });
$('prev').onclick = () => send({ type: 'prev' });

if (roomFromUrl) $('room').focus();
</script>
</body>
</html>
